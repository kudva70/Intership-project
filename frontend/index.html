
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalDesk AI | Incident Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="eyebrow">SIGNALDESK AI</p>
            <h1>Incident Assistant</h1>
            <p class="subtitle">
                Describe a technical issue to begin troubleshooting.
            </p>
        </header>

        <section class="panel">
            <form id="incident-form">
                <label for="title">Issue title</label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    minlength="3"
                    maxlength="120"
                    placeholder="e.g. Login returns a 500 error"
                    required
                >

                <label for="description">Describe the problem</label>
                <textarea
                    id="description"
                    name="description"
                    minlength="10"
                    maxlength="2000"
                    rows="5"
                    placeholder="What happened? When did it start? What have you tried?"
                    required
                ></textarea>

                <button id="submit-button" type="submit">
                    Submit incident
                </button>
            </form>

            <p id="status" role="status" aria-live="polite"></p>

            <section id="result" class="result" hidden>
                <h3>Incident analysis</h3>
                <p id="result-title"></p>
                <p id="result-description"></p>
                <p id="result-category"></p>
                <p id="category-reason" class="muted"></p>
                <p id="result-priority"></p>
                <p id="priority-reason" class="muted"></p>
                <p id="result-status" class="muted"></p>
            </section>
        </section>

        <footer>
            Prototype · AI-assisted incident triage
        </footer>
    </main>

    <script>
       
        const form = document.getElementById("incident-form");
        const button = document.getElementById("submit-button");
        const statusMessage = document.getElementById("status");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();

            statusMessage.textContent = "";
            result.hidden = true;
            button.disabled = true;
            button.textContent = "Analyzing...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/incidents/analyze",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ title, description })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    const details = Array.isArray(data.detail)
                        ? data.detail.map(item => item.msg).join(", ")
                        : data.detail || "Request failed.";

                    throw new Error(details);
                }

                document.getElementById("result-title").textContent =
                    "Title: " + data.title;

                document.getElementById("result-description").textContent =
                    "Description: " + data.description;

                document.getElementById("result-category").textContent =
                    "Category: " + data.category;

                document.getElementById("category-reason").textContent =
                    "Why this category? " + data.category_reason;

                document.getElementById("result-priority").textContent =
                    "Priority: " + data.priority;

                document.getElementById("priority-reason").textContent =
                    "Why this priority? " + data.priority_reason;

                document.getElementById("result-status").textContent =
                    "Status: " + data.status;

                result.hidden = false;
                statusMessage.textContent = "Incident analyzed successfully.";

            } catch (error) {
                console.error(error);
                statusMessage.textContent =
                    "Could not submit the incident. " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Submit incident";
            }
        });

    </script>
</body>
</html>
